# Complete, redacted reference configuration for cross-cloud PostgreSQL
# logical replication via AWS DMS (Aurora -> on-premises Outpost)
# Referenced in: case-studies/09-postgresql-logical-replication-permission-gap.md

# --- Source Endpoint (Aurora PostgreSQL) ---
- name: "dms-postgres-cloud-source"
  secrets_manager_arn: "<secrets_manager_arn>"
  engine_name: "postgres"
  database_name: "<your_database_name>"
  endpoint_type: "source"
  extra_connection_attributes: "PluginName=pglogical;"
  postgres_settings:
    plugin_name: "pglogical"
  ssl_mode: "require"
  tags:
    Name: "dms-postgres-cloud-source"
    Managed: "Infrastructure"
    Environment: "Production"

# --- Target Endpoint (Outpost PostgreSQL) ---
- name: "dms-postgres-outpost-target"
  secrets_manager_arn: "<secrets_manager_arn>"
  engine_name: "postgres"
  database_name: "<your_database_name>"
  endpoint_type: "target"
  tags:
    Name: "dms-postgres-outpost-target"
    Managed: "Infrastructure"
    Environment: "Production"

# --- Replication Task ---
- name: "dms-postgres-cloud-to-outpost-task"
  migration_type: "full-load-and-cdc"
  replication_instance_arn: "<replication_instance_arn>"
  source_endpoint_arn: "<source_endpoint_arn>"
  target_endpoint_arn: "<target_endpoint_arn>"
  start_replication_task: false
  replication_task_settings:
    FullLoadSettings:
      TargetTablePrepMode: "DROP_AND_CREATE"
      MaxFullLoadSubTasks: 8
      CommitRate: 10000
      CreatePkAfterFullLoad: false
      TransactionConsistencyTimeout: 600
      StopTaskCachedChangesApplied: false
      StopTaskCachedChangesNotApplied: false
    TargetMetadata:
      SupportLobs: true
      FullLobMode: false
      LimitedSizeLobMode: true
      LobMaxSize: 32
      LobChunkSize: 64
      BatchApplyEnabled: true
    ChangeProcessingDdlHandlingPolicy:
      HandleSourceTableDropped: true
      HandleSourceTableTruncated: true
      HandleSourceTableAltered: true
    ChangeProcessingTuning:
      BatchApplyPreserveTransaction: true
      BatchApplyTimeoutMin: 1
      BatchApplyTimeoutMax: 30
      BatchApplyMemoryLimit: 500
      CommitTimeout: 1
      MemoryLimitTotal: 1024
      MemoryKeepTime: 60
      StatementCacheSize: 50
      MinTransactionSize: 1000
    Logging:
      EnableLogging: true
    ErrorBehavior:
      DataErrorPolicy: "LOG_ERROR"
      DataErrorEscalationPolicy: "SUSPEND_TABLE"
      TableErrorPolicy: "SUSPEND_TABLE"
      TableErrorEscalationPolicy: "STOP_TASK"
      ApplyErrorDeletePolicy: "LOG_ERROR"
      ApplyErrorInsertPolicy: "LOG_ERROR"
      ApplyErrorUpdatePolicy: "LOG_ERROR"
      ApplyErrorEscalationPolicy: "STOP_TASK"
      FullLoadIgnoreConflicts: true
      FailOnNoTablesCaptured: true
      RecoverableErrorCount: 8
      RecoverableErrorInterval: "5"
  table_mappings_rule:
    rules:
      - rule-id: "500"
        rule-type: "selection"
        rule-name: "include-all-public-tables"
        rule-action: "include"
        object-locator:
          schema-name: "public"
          table-name: "%"
      - rule-id: "501"
        rule-type: "selection"
        rule-name: "exclude-pg-system-schemas"
        rule-action: "exclude"
        object-locator:
          schema-name: "pg_%"
          table-name: "%"
      - rule-id: "502"
        rule-type: "selection"
        rule-name: "exclude-information-schema"
        rule-action: "exclude"
        object-locator:
          schema-name: "information_schema"
          table-name: "%"
      - rule-id: "503"
        rule-type: "selection"
        rule-name: "exclude-pglogical-schema"
        rule-action: "exclude"
        object-locator:
          schema-name: "pglogical"
          table-name: "%"

# --- The critical fix required beyond standard documented permissions ---
# Run on the target database:
#
# ALTER SCHEMA public OWNER TO dms_user;
# GRANT ALL ON SCHEMA public TO dms_user;
# GRANT ALL ON DATABASE <your_database_name> TO dms_user;
